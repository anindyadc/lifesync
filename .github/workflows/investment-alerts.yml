name: Investment Telegram Alerts

on:
  schedule:
    # 08:05 IST daily (IST = UTC+5:30)
    - cron: '35 2 * * *'
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts/investment-reminders
        run: npm ci

      - name: Send alerts
        working-directory: scripts/investment-reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_UID: ${{ secrets.TARGET_UID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Days before maturity / lock-in end on which to alert (0 = on the day).
          ALERT_DAYS: '30,7,1,0'
        run: node send-alerts.js
